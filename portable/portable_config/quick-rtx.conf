[quick-d3d11-output]
vo=gpu-next
gpu-context=d3d11
target-colorspace-hint=auto

[quick-rtx-d3d11]
profile=quick-d3d11-output
hwdec=d3d11va

[quick-hdr-passthrough]
profile=quick-rtx-d3d11

[quick-output-sdr]
profile=quick-d3d11-output
d3d11-output-csp=srgb
target-colorspace-hint=yes
target-trc=srgb
target-prim=bt.709

[quick-output-hdr]
profile=quick-d3d11-output
d3d11-output-csp=pq
target-colorspace-hint=yes
target-trc=pq
target-prim=bt.2020

[quick-rtx-vsr]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=scale=2:scaling-mode=nvidia

[quick-rtx-hdr]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=nvidia-true-hdr=yes

[quick-rtx-both]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=scale=2:scaling-mode=nvidia:nvidia-true-hdr=yes

[default]
