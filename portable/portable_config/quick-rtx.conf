[quick-rtx-d3d11]
vo=gpu-next
gpu-context=d3d11
hwdec=d3d11va
target-colorspace-hint=auto

[quick-hdr-passthrough]
profile=quick-rtx-d3d11

[quick-rtx-vsr]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=scale=2:scaling-mode=nvidia

[quick-rtx-hdr]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=nvidia-true-hdr=yes

[quick-rtx-both]
profile=quick-rtx-d3d11
vf-append=@quick_rtx:d3d11vpp=scale=2:scaling-mode=nvidia:nvidia-true-hdr=yes

[default]
