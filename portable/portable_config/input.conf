SPACE cycle pause
LEFT seek -5 exact
RIGHT seek 5 exact
Shift+LEFT frame-back-step
Shift+RIGHT frame-step
UP add volume 5
DOWN add volume -5
f cycle fullscreen
ESC script-message quick-escape
Ctrl+o script-message quick-open
Ctrl+O script-message quick-open
Ctrl+, script-message quick-preferences
Ctrl+i script-message quick-stats
Ctrl+w quit
Ctrl+q quit
m cycle mute
l cycle-values loop-file inf no
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT script-message quick-menu
