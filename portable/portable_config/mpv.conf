osc=no
border=yes
title-bar=no
idle=yes
force-window=yes
keep-open=yes
input-builtin-dragging=no
osd-bar=no
osd-font=Segoe UI
osd-font-size=22
osd-border-size=1
background-color="#0B1940"
autofit=1100x720
keepaspect=yes
keepaspect-window=yes
auto-window-resize=yes
hwdec=auto-safe
vo=gpu
gpu-context=win
volume=75
volume-max=100
cursor-autohide=2500
title=${?idle-active==yes:QuickMPV}${!idle-active==yes:${media-title} - QuickMPV}
screenshot-directory=~~/screenshots

include=~~/quick-rtx.conf
include=~~/quick-preferences.conf
